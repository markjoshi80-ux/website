<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sponsors | Faithful Hands & Hope Collective Society</title>
    <meta name="description" content="Meet sponsors and community partners supporting Faithful Hands & Hope Collective Society.">
    <meta name="theme-color" content="#0b5f24">
    <meta property="og:title" content="Sponsors of Faithful Hands & Hope Collective Society">
    <meta property="og:description" content="Community partners helping make the work possible.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="assets/faithful-hands-hero.png">
    <link rel="icon" href="assets/faithful-hands-logo-cropped.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="main">
      <section class="page-hero sponsors-hero">
        <div class="section-inner page-hero-inner">
          <p class="eyebrow">Sponsors</p>
          <h1>Community partners helping make the work possible.</h1>
        </div>
      </section>

      <section class="section" aria-labelledby="sponsor-list-title">
        <div class="section-inner">
          <div class="section-heading centered">
            <p class="eyebrow">Current sponsors</p>
            <h2 id="sponsor-list-title">Thank you to the organizations standing with the community.</h2>
          </div>

          <div class="sponsor-grid" aria-label="Sponsor logos">
            <div class="sponsor-logo"><img src="assets/animomma.png" alt="AnimO Boxing & MMA"></div>
            <div class="sponsor-logo"><img src="assets/bhutcamp.png" alt="BHUtcamp"></div>
            <div class="sponsor-logo"><img src="assets/chanel.png" alt="Chanel"></div>
            <div class="sponsor-logo"><img src="assets/creed.png" alt="Creed"></div>
            <div class="sponsor-logo"><img src="assets/londondrugs.png" alt="London Drugs"></div>
            <div class="sponsor-logo"><img src="assets/mcdonalds.png" alt="McDonald's Canada"></div>
            <div class="sponsor-logo"><img src="assets/microsoft.png" alt="Microsoft"></div>
            <div class="sponsor-logo"><img src="assets/oxygenyogaandfitness.png" alt="Oxygen Yoga & Fitness"></div>
            <div class="sponsor-logo"><img src="assets/panago.png" alt="Panago Pizza"></div>
            <div class="sponsor-logo"><img src="assets/petcetera.png" alt="Petcetera"></div>
            <div class="sponsor-logo"><img src="assets/popeyes.png" alt="Popeye's Supplements"></div>
            <div class="sponsor-logo"><img src="assets/saveonfoods.jpg" alt="Save-On-Foods"></div>
            <div class="sponsor-logo"><img src="assets/thecandycurio.png" alt="The Candy Curio"></div>
            <div class="sponsor-logo"><img src="assets/theemeraldclub.png" alt="The Emerald Club Yoga & Fitness"></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
